# The reasoning-dense mixture of the dose experiment (README §1.3), 300M tokens.
#
# Why these shares. In the 0.8B design (40M tokens) math text lowered the math loss most (t = 13) and rewritten
# text raised few-shot reasoning (GSM8K pass@16 +1.7 per 10% of the tokens); neither survived the in-domain probe at
# that dose. Here the dose is 7.5 times larger and the reasoning text is mostly real: FineMath pages (25%) and
# questions with worked answers mined from the web (WebInstructSub, 25%). The teacher's rewrites (5%, about 15M of
# their 11M tokens: 1.4 passes) stay in, at a share that does not repeat them much. Replay keeps 35%: educational web
# text and Chinese Wikipedia. Long sequences are left out (semantic packs lowered few-shot GSM8K in the design).
token_budget: 300023808           # 9,156 steps of 32,768 tokens
context_length: 4096
components:
  replay_web_edu: 0.30
  wiki_zh: 0.05
  math_web: 0.125
  math_web_extra: 0.125
  reasoning_qa: 0.25
  synthetic_rephrase: 0.025
  synthetic_qa: 0.025
  code: 0.07
  textbooks: 0.03
schedule: uniform
seed: 1
