# The distillation mixture of the dose experiment (README §1.2), 100M tokens.
#
# Why. At 300M tokens every mixture of public text made the 0.8B model worse (README §1.2), and interpolating a run
# with the base only gave the base back: the text held nothing these tasks need that the base did not already have.
# Here 40% of the tokens are worked solutions written by the 27B teacher for the training problems of GSM8K and MATH
# (`synthetic_solutions`, only solutions whose final answer is right, at most four per problem); 45,177 solutions and
# 23.2M tokens, so 100M tokens see each solution 1.7 times. The rest keeps web text small, as in the QA-heavy recipe.
token_budget: 100007936           # 3,052 steps of 32,768 tokens
context_length: 4096
components:
  synthetic_solutions: 0.40
  reasoning_qa: 0.15
  math_web: 0.10
  code: 0.10
  textbooks: 0.05
  wiki_en: 0.05
  replay_web_edu: 0.10
  wiki_zh: 0.05
schedule: uniform
seed: 1
