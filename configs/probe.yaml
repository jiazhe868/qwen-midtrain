# The fixed short fine-tune ("SFT probe") that every candidate checkpoint goes through, and how it is tested after.
#
# Nothing here changes between candidates: the same conversations in the same order, the same learning rate and
# steps, the same test items and sampling. A difference after the probe then comes from the checkpoint alone.
# The probe is small on purpose: it has to run for dozens of candidates. Its numbers are not meant as the best a
# checkpoint can reach, only as a ranking of checkpoints (README §2.2).

data:
  seed: 20261120
  maximum_tokens_per_conversation: 1536      # longer rows are dropped: 4 of them would fill a whole forward pass
  sources:                                   # how many conversations each source contributes
    gsm8k_train: 7400                        # human solutions, grade-school word problems
    math_train: 7500                         # human solutions, competition mathematics (the test items are excluded by split)
    mbpp_train: 460                          # human reference programs
    code_instructions: 3000                  # smoltalk self-oss-instruct: Python functions checked by execution
    instruction_following: 1500              # smoltalk smol-constraints
    summarization: 800                       # smoltalk smol-summarize
    rewriting: 800                           # smoltalk smol-rewrite
    everyday_conversation: 800               # smoltalk everyday-conversations

training:
  epoch_count: 2
  peak_learning_rate: 2.0e-5                 # linear warm-up over 3% of the steps, then linear decay to zero
  warmup_step_share: 0.03
  tokens_per_step: 32768                     # padded tokens
  seed: 1

evaluation:
  sample_count: 64                           # completions per item, for pass@1 ... pass@64
  temperature: 1.0
  top_p: 1.0
  item_seed: 20261120                        # the items of each task are the first N after a shuffle with this seed
  tasks:                                     # items, and the longest completion allowed
    gsm8k: {item_count: 200, maximum_new_tokens: 512}
    math500: {item_count: 250, maximum_new_tokens: 512}
    humaneval: {item_count: 164, maximum_new_tokens: 512}
    mbpp: {item_count: 200, maximum_new_tokens: 512}
  pass_at_k: [1, 2, 4, 8, 16, 32, 64]
